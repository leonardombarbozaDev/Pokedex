<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Pokémon</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Nunito&display=swap"
          rel="stylesheet">
</head>
<div class="imagens-cantos">
    <img src="https://www.imagensanimadas.com/data/media/1446/pokemon-imagem-animada-0083.gif"
         class="imagem-esquerda" alt="BolaPokemon">
</div>
<body>
    <header class="cabecalho">
        <h1 data-i18n="title">ÁLBUM POKÉMON</h1>
        <div class="seletor-idioma">
            <label for="idioma" data-i18n="languageLabel">Idioma:</label>
            <select id="idioma" aria-label="Selecionar idioma">
                <option value="pt">🇧🇷 Português</option>
                <option value="en">🇺🇸 English</option>
                <option value="es">🇪🇸 Español</option>
            </select>
        </div>
    </header>

   <form class="filter-container" id="form-pesquisa">
        <input
            type="text"
            id="filter"
            class="filter"
            placeholder="Pesquisar Pokémon..." data-i18n-placeholder="placeholder"
            autocomplete="off"
            aria-label="Pesquisar Pokémon" data-i18n-aria="searchLabel">
        <div class="acoes-pesquisa">
            <button type="submit" class="botao-pesquisa" data-i18n="search">Pesquisar</button>
            <button type="button" id="limpar-pesquisa" class="botao-pesquisa" data-i18n="clear">Limpar</button>
        </div>
        <button type="button" id="btn-informacoes" class="btn-informacoes">
             ⓘ
</button>

<div id="painel-informacoes" class="painel-informacoes">
    <button id="fechar-informacoes" class="fechar-info">
        ×
    </button>

    <h2 data-i18n="aboutTitle">Sobre o Projeto</h2>

    <p><strong data-i18n="projectLabel">Projeto:</strong> <span data-i18n="projectName">Álbum Pokémon</span></p>
    <p><strong data-i18n="courseLabel">Curso:</strong> <span data-i18n="courseName">Ciência da Computação</span></p>
    <p><strong data-i18n="collegeLabel">Faculdade:</strong> FIB</p>
    <p><strong data-i18n="technologiesLabel">Tecnologias:</strong> HTML, CSS e JavaScript</p>
    <p><strong data-i18n="objectiveLabel">Objetivo:</strong> <span data-i18n="objectiveText">Apresentar e pesquisar Pokémon</span></p>
    <p><strong data-i18n="namesLabel">Nomes:</strong><br>
  Ana Julia Schucheman<br>
  André L. Monteço<br>
  Leonardo Barboza<br>
  Mariana Mendes<br>
  Naihara Neves
    </p>
</div>
    </form>

    <div id="ultima-pesquisa" class="ultima-pesquisa" aria-live="polite"></div>
    <div id="pokemon-pesquisado" aria-live="polite"></div>

    <main class="container">
        <section class="grade-pokemon" id="grade-pokemon" aria-label="Álbum de Pokémon">
            <p class="mensagem">Carregando Pokémon...</p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
</html>
